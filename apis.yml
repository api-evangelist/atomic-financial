apis:
  - aid: atomic-financial:atomic-deposit-api
    name: Atomic Deposit API
    description: >-
      Deposit (formerly Direct Deposit Switching) lets users redirect all or part of their paycheck to a new account.
      Atomic connects to thousands of payroll providers and employers, signs in on the user's behalf with their consent,
      and updates direct-deposit allocations — supporting total, fixed-amount, or percentage-based distributions.
    humanURL: https://docs.atomicfi.com/reference/transact-sdk
    baseURL: https://api.atomicfi.com
    tags:
      - Direct Deposit
      - Paycheck
      - Income
      - Distribution
    properties:
      - url: https://docs.atomicfi.com/reference/transact-sdk
        type: Documentation
      - url: https://docs.atomicfi.com/reference/api
        type: APIReference
      - url: https://console.atomicfi.com/signup
        type: SignUp
  - aid: atomic-financial:atomic-verify-api
    name: Atomic Verify API
    description: >-
      Verify provides instant income and employment verification by connecting to the consumer's payroll provider or
      employer. Lenders, landlords, and fintechs use it to retrieve verified pay statements, gross/net income, employer
      identity, and employment status without faxed pay stubs.
    humanURL: https://docs.atomicfi.com/reference/transact-sdk
    baseURL: https://api.atomicfi.com
    tags:
      - Employment Verification
      - Income Verification
      - Underwriting
      - KYC
    properties:
      - url: https://docs.atomicfi.com/reference/transact-sdk
        type: Documentation
      - url: https://docs.atomicfi.com/reference/api
        type: APIReference
  - aid: atomic-financial:atomic-paylink-api
    name: Atomic PayLink API
    description: >-
      PayLink lets consumers update their card-on-file across merchants and subscription services. It is also the
      foundation for subscription discovery, bill management, and Atomic's Manage / Switch product line — enabling
      pause, cancel, reactivate, and card-update flows across thousands of merchants.
    humanURL: https://docs.atomicfi.com/reference/transact-sdk
    baseURL: https://api.atomicfi.com
    tags:
      - PayLink
      - Subscriptions
      - Card On File
      - Bill Pay
      - Merchants
    properties:
      - url: https://docs.atomicfi.com/reference/transact-sdk
        type: Documentation
      - url: https://docs.atomicfi.com/reference/api
        type: APIReference
  - aid: atomic-financial:atomic-tax-api
    name: Atomic Tax API
    description: >-
      Tax retrieves W-2s, 1099s, and other tax documents directly from the user's payroll provider, and unlocks
      tax-refund use cases such as early-deposit and refund-advance products for banks and credit unions.
    humanURL: https://docs.atomicfi.com/reference/transact-sdk
    baseURL: https://api.atomicfi.com
    tags:
      - Taxes
      - W-2
      - 1099
      - Documents
    properties:
      - url: https://docs.atomicfi.com/reference/transact-sdk
        type: Documentation
      - url: https://docs.atomicfi.com/reference/api
        type: APIReference
  - aid: atomic-financial:atomic-authentication-api
    name: Atomic Authentication API
    description: >-
      Atomic's authentication layer powers user-permissioned access to third-party payroll, employer, and merchant
      systems. Three flavors are supported - StandardAuth (credential / 2FA proxy), TrueAuth (deviceless, fully
      automated), and CoAuth (assisted authentication for hard-to-reach systems).
    humanURL: https://docs.atomicfi.com/reference/api
    baseURL: https://api.atomicfi.com
    tags:
      - Authentication
      - StandardAuth
      - TrueAuth
      - CoAuth
      - OAuth
    properties:
      - url: https://docs.atomicfi.com/reference/api
        type: APIReference
      - url: https://docs.atomicfi.com/reference/transact-sdk
        type: Documentation
  - aid: atomic-financial:atomic-webhooks-api
    name: Atomic Webhooks API
    description: >-
      Atomic delivers task, company, and continuous-access events to your endpoint using the CloudEvents binary content
      mode. Events include task-status-updated, task-workflow-finished, payroll-data-fetched, deposit-accounts-synced,
      employment-updated, income-updated, statements-added, timesheets-added, taxes-added, and linked-account
      connected/disconnected.
    humanURL: https://docs.atomicfi.com/reference/webhooks
    baseURL: https://api.atomicfi.com
    tags:
      - Webhooks
      - Events
      - CloudEvents
      - Notifications
    properties:
      - url: https://docs.atomicfi.com/reference/webhooks
        type: Documentation
      - url: https://docs.atomicfi.com/reference/api
        type: APIReference
  - aid: atomic-financial:atomic-transact-sdk
    name: Atomic Transact SDK
    description: >-
      The Transact SDK is the user-facing client that drives every Atomic flow — authentication, account selection,
      consent, and task execution. It ships as an embeddable web component plus native libraries for iOS, Android,
      React Native, Flutter, and Capacitor. Configuration is task-based (operation = deposit | verify | identify | tax
      | auth) with theming, language, deeplink, search-rules, and metadata hooks.
    humanURL: https://docs.atomicfi.com/reference/transact-sdk
    tags:
      - SDK
      - JavaScript
      - iOS
      - Android
      - React Native
      - Flutter
      - Capacitor
    properties:
      - url: https://docs.atomicfi.com/reference/transact-sdk
        type: Documentation
      - url: https://github.com/atomicfi/atomic-transact-javascript
        type: SDK
      - url: https://github.com/atomicfi/atomic-transact-ios
        type: SDK
      - url: https://github.com/atomicfi/atomic-transact-android-public
        type: SDK
      - url: https://github.com/atomicfi/atomic-transact-react-native
        type: SDK
      - url: https://github.com/atomicfi/atomic-transact-flutter
        type: SDK
      - url: https://github.com/atomicfi/atomic-transact-capacitor
        type: SDK
