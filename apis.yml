aid: atomic-financial
name: Atomic
url: https://raw.githubusercontent.com/api-evangelist/atomic-financial/refs/heads/main/apis.yml
image: https://atomic.financial/wp-content/uploads/2023/02/atomic-logo.svg
description: >-
  Atomic is the connected-banking infrastructure for income, payroll, and merchant data. Their user-permissioned APIs
  let banks, lenders, fintechs, and HR platforms link consumers to thousands of payroll providers, gig platforms,
  employers, and merchants — and then read or update that data in real time. Core use cases include direct-deposit
  switching, paycheck-linked income and employment verification, tax-document retrieval, and card-on-file / subscription
  management. Integration is done through the Transact SDK (web, iOS, Android, React Native, Flutter, Capacitor) plus a
  REST API at api.atomicfi.com that manages access tokens, tasks, companies, deposit accounts, and webhooks. Atomic is
  headquartered in Salt Lake City, Utah.
